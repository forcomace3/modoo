<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212D64">
<meta name="robots" content="noindex">
<title>간편 관리 · 회원 관리 (Admin)</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--brand:#10893E;--brand-dark:#0B6B30;--brand-light:#E6F4EA;--navy:#212D64;--danger:#DC2626;--danger-light:#FEE9E9;
  --warn:#B45309;--warn-light:#FEF3E2;--ink:#0F172A;--ink2:#475569;--ink3:#94A3B8;--line:#D8DEE6;--bg:#F5F7FA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{border:none;background:none;cursor:pointer}
.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:6px 12px;white-space:nowrap}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 60px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.tile small{display:block;font-size:12.5px;font-weight:700;color:var(--ink2)}
.tile b{display:block;font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.tile.r b{color:var(--danger)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.inp{flex:1;min-width:150px;border:2px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-weight:600;background:#fff}
.inp:focus{outline:none;border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:800;background:var(--brand);color:#fff;white-space:nowrap}
.btn.gray{background:#E9EDF2;color:var(--ink2)}.btn.line{background:#fff;color:var(--brand-dark);border:2px solid var(--brand)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.45}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px}
.card.off{opacity:.6}
.row1{display:flex;align-items:flex-start;gap:10px}
.nm{font-size:17px;font-weight:800;line-height:1.3}
.sub{font-size:13.5px;color:var(--ink2);font-weight:600;margin-top:2px;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:#EEF1F5;color:var(--ink2)}
.tag.g{background:var(--brand-light);color:var(--brand-dark)}.tag.y{background:var(--warn-light);color:var(--warn)}.tag.r{background:var(--danger-light);color:var(--danger)}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.memo{font-size:13.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.empty{text-align:center;color:var(--ink2);padding:40px 10px;font-weight:700;line-height:1.7}
.msg{background:var(--danger-light);color:var(--danger);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:800;margin-bottom:12px}
.hide{display:none !important}
.dim{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.dim.on{display:flex}
.sheet{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:4px}
.lab{font-size:13.5px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.sheet .inp{width:100%;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:26px;background:#0F172A;color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:80;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.stat h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.stat h3 span{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:#EEF1F5;color:var(--ink2)}
.chip.g{background:var(--brand-light);color:var(--brand-dark)}.chip.y{background:var(--warn-light);color:var(--warn)}.chip.r{background:var(--danger-light);color:var(--danger)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #EEF1F5;font-size:13.5px}
.kv:last-child{border-bottom:none}.kv span{color:var(--ink2);font-weight:700;flex-shrink:0}.kv b{text-align:right;word-break:break-all}
.sheet.wide{max-width:680px}
.sec{margin-top:16px}.sec h4{font-size:14px;font-weight:800;margin-bottom:6px;color:var(--navy)}
.li{font-size:13px;color:var(--ink2);padding:6px 0;border-bottom:1px dashed #E3E7ED;line-height:1.5}.li:last-child{border-bottom:none}
.li b{color:var(--ink)}
.room{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.room .t{font-weight:800;font-size:14.5px}
.stat.fold #statB{display:none}
.stat h3 .sum{font-size:12.5px;color:var(--ink2);font-weight:700;flex:1;text-align:right;margin-right:6px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.fchip{font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sel{border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800;background:#fff;color:var(--ink2)}
.rows{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rw{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:11px 14px;border-bottom:1px solid #EEF1F5;cursor:pointer}
.rw:last-child{border-bottom:none}.rw:hover{background:#F8FAFC}.rw.off{opacity:.55}
.rw .n{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .n small{font-weight:700;color:var(--ink2);font-size:12.5px;margin-left:6px}
.rw .b{font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .st{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .ic{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.dot{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:#EEF1F5;color:var(--ink2)}
.dot.r{background:var(--danger-light);color:var(--danger)}.dot.y{background:var(--warn-light);color:var(--warn)}.dot.g{background:var(--brand-light);color:var(--brand-dark)}
.cnt{font-size:12.5px;color:var(--ink2);font-weight:700;margin:0 2px 8px}
@media(max-width:560px){.rw{grid-template-columns:minmax(0,1fr) auto}.rw .st{grid-column:1/-1;margin-top:-4px}}
</style>
</head>
<body>
<div class="top">
  <button onclick="location.href='index.html?home=1'">⌂ 처음으로</button>
  <b>간편 관리 · 회원 관리</b>
  <button onclick="load()">새로 고침</button>
</div>

<div class="wrap">
  <!-- 관리자 로그인 -->
  <div id="vLogin" class="hide">
    <div class="card" style="max-width:420px;margin:30px auto">
      <div class="nm">관리자만 볼 수 있는 화면입니다</div>
      <div class="sub">포컴 관리자 비밀번호를 넣어 주세요.</div>
      <div id="loErr" class="msg hide" style="margin-top:12px"></div>
      <div class="lab">관리자 비밀번호</div>
      <input class="inp" style="width:100%" id="loPin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password">
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn" style="flex:1" id="loGo" onclick="adminLogin()">들어가기</button>
      </div>
    </div>
  </div>

  <!-- 목록 -->
  <div id="vList" class="hide">
    <div id="err" class="msg hide"></div>
    <div class="stat fold" id="stat"><h3 style="cursor:pointer" onclick="toggleStat()"><span>🖥 서버 상태</span><span class="sum" id="statSum">확인하는 중…</span><button class="btn sm gray" onclick="event.stopPropagation();loadStatus()">다시 보기</button></h3><div id="statB" class="sub" style="margin-top:8px">불러오는 중…</div></div>
    <div class="tiles">
      <div class="tile"><small>가입한 건물주</small><b id="tOwners">-</b></div>
      <div class="tile"><small>등록된 세대</small><b id="tUnits">-</b></div>
      <div class="tile"><small>이번 주 앱 사용</small><b id="tActive">-</b></div>
      <div class="tile r"><small>확인 필요한 건물주</small><b id="tWarn">-</b></div>
    </div>
    <div class="bar">
      <input class="inp" id="q" placeholder="이름 · 전화번호 · 건물로 찾기" oninput="render()">
      <select class="sel" id="sortBy" onchange="render()"><option value="act">최근 활동순</option><option value="warn">문제 많은 순</option><option value="name">이름순</option><option value="new">가입순</option></select>
      <button class="btn" onclick="openNew()">＋ 건물주 등록</button>
    </div>
    <div class="fchips" id="fchips"></div>
    <div class="cnt" id="cnt"></div>
    <div class="rows" id="list"></div>
  </div>
</div>

<div class="dim" id="dim" onclick="if(event.target.id==='dim')closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
var MAIN="https://mhidojbzbneajdxivfvc.supabase.co/functions/v1/api", EASY="https://mhidojbzbneajdxivfvc.supabase.co/functions/v1/easy";
var TK="", LIST=[];
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function won(n){ return (Math.round(n)||0).toLocaleString('ko-KR'); }
function tel(p){ p=String(p||''); return p.length===11 ? p.slice(0,3)+'-'+p.slice(3,7)+'-'+p.slice(7) : p.length===10 ? p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6) : p; }
function day(s){ if(!s) return '-'; var d=new Date(s); if(isNaN(d)) return '-'; return (d.getMonth()+1)+'/'+d.getDate(); }
function thisYm(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); },2400); }
function sheet(h){ $('sheet').innerHTML=h; $('dim').classList.add('on'); }
window.closeSheet=function(){ $('dim').classList.remove('on'); $('sheet').classList.remove('wide'); };
function post(url, body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){ return r.json(); });
}
function show(v){ $('vLogin').classList.toggle('hide', v!=='login'); $('vList').classList.toggle('hide', v!=='list'); }

/* ---------- 관리자 확인 ---------- */
function savedTk(){
  try{ var o=JSON.parse(sessionStorage.getItem('fc_op')||'null'); if(o&&o.tk) return o.tk; }catch(e){}
  try{ var s=JSON.parse(localStorage.getItem('fc_sess')||'null'); if(s&&s.tk&&s.role==='admin') return s.tk; }catch(e){}
  return '';
}
function keepTk(tk){ TK=tk; try{ sessionStorage.setItem('fc_op', JSON.stringify({tk:tk})); }catch(e){} }
window.adminLogin=function(){
  var pin=$('loPin').value.trim(), b=$('loGo'); b.disabled=true; $('loErr').classList.add('hide');
  post(MAIN,{action:'login',mode:'admin',pin:pin}).then(function(j){
    b.disabled=false;
    if(j.ok && j.role==='admin'){ keepTk(j.tk); $('loPin').value=''; load(); }
    else { $('loErr').textContent=j.error||'들어가지 못했습니다'; $('loErr').classList.remove('hide'); }
  }).catch(function(){ b.disabled=false; $('loErr').textContent='인터넷 연결을 확인해 주세요.'; $('loErr').classList.remove('hide'); });
};

/* ---------- 목록 ---------- */
window.load=function(){
  if(!TK) TK=savedTk();
  var first=function(){
    if(TK) return Promise.resolve();
    /* 테스트 모드에서는 비밀번호 없이 관리자 토큰을 받습니다 */
    return post(MAIN,{action:'login',mode:'admin',pin:''}).then(function(j){ if(j.ok&&j.role==='admin') keepTk(j.tk); }).catch(function(){});
  };
  first().then(function(){
    if(!TK){ show('login'); return; }
    return fetch(EASY+'?api=owners&tk='+encodeURIComponent(TK)).then(function(r){ return r.json(); }).then(function(j){
      if(j.ok){ LIST=j.owners||[]; show('list'); $('err').classList.add('hide'); render(); loadStatus(); }
      else if(j.auth){ TK=''; try{ sessionStorage.removeItem('fc_op'); }catch(e){} show('login'); }
      else { show('list'); $('err').textContent=j.error||'불러오지 못했습니다'; $('err').classList.remove('hide'); }
    });
  }).catch(function(){ show('list'); $('err').textContent='인터넷 연결을 확인해 주세요.'; $('err').classList.remove('hide'); });
};
var FILTER='all';
window.toggleStat=function(){ $('stat').classList.toggle('fold'); };
window.setFilter=function(f){ FILTER=f; render(); };
function warnList(o){
  var w=[];
  if(o.disabled) w.push(['정지','']);
  if(!o.setupDone) w.push(['설정 중','y']);
  if(o.unpaidN) w.push(['미납 '+o.unpaidN,'r']);
  if(o.errs7) w.push(['오류 '+o.errs7,'r']);
  if(o.consentWait) w.push(['동의 대기','y']);
  if(o.noCat) w.push(['구분 미정 '+o.noCat,'y']);
  if(o.appBuild && SITE_BUILD && o.appBuild!==SITE_BUILD) w.push(['옛 판','y']);
  return w;
}
function warnScore(o){ return (o.unpaidN?4:0)+(o.errs7?3:0)+(o.consentWait?2:0)+(o.noCat?1:0)+((o.appBuild&&SITE_BUILD&&o.appBuild!==SITE_BUILD)?1:0)+(!o.setupDone?1:0); }
window.render=function(){
  var ym=thisYm(), q=$('q').value.trim().toLowerCase().replace(/-/g,'');
  var act=LIST.filter(function(o){ return !o.disabled; });
  $('tOwners').textContent=LIST.length+'명';
  $('tUnits').textContent=won(act.reduce(function(a,o){ return a+o.units; },0))+'세대';
  var wk=Date.now()-7*86400000;
  $('tActive').textContent=act.filter(function(o){ var d=new Date(o.appSeen||o.updatedAt||0); return d.getTime()>wk; }).length+' / '+act.length+'명';
  var wn=act.filter(function(o){ return warnScore(o)>0; }).length;
  $('tWarn').textContent=wn+'명'; $('tWarn').parentNode.classList.toggle('r', wn>0);
  /* 필터 칩 (개수 포함) */
  var F=[['all','전체',LIST.length],['warn','확인 필요',LIST.filter(function(o){ return !o.disabled && warnScore(o)>0; }).length],['unpaid','미납',LIST.filter(function(o){ return !o.disabled && o.unpaidN; }).length],
         ['setup','설정 중',LIST.filter(function(o){ return !o.disabled && !o.setupDone; }).length],['off','정지',LIST.filter(function(o){ return o.disabled; }).length]];
  $('fchips').innerHTML=F.map(function(f){ return '<span class="fchip'+(FILTER===f[0]?' on':'')+'" onclick="setFilter(\''+f[0]+'\')">'+f[1]+' '+f[2]+'</span>'; }).join('');
  var rows=LIST.filter(function(o){
    if(FILTER==='warn' && !(!o.disabled && warnScore(o)>0)) return false;
    if(FILTER==='unpaid' && !(!o.disabled && o.unpaidN)) return false;
    if(FILTER==='setup' && !(!o.disabled && !o.setupDone)) return false;
    if(FILTER==='off' && !o.disabled) return false;
    if(!q) return true;
    return (o.bldg+' '+o.name+' '+o.phone+' '+o.addr+' '+o.memo).toLowerCase().indexOf(q)>=0;
  });
  var sb=$('sortBy').value;
  rows.sort(function(a,b){
    if(sb==='name') return String(a.name||'').localeCompare(String(b.name||''),'ko');
    if(sb==='new') return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
    if(sb==='warn'){ var d=warnScore(b)-warnScore(a); if(d) return d; }
    return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''));
  });
  $('cnt').textContent=rows.length+'명'+(q||FILTER!=='all'?' (전체 '+LIST.length+'명)':'')+' · 누르면 자세히 보입니다';
  if(!LIST.length){ $('list').innerHTML='<div class="empty">아직 가입한 건물주가 없습니다.<br>“＋ 건물주 등록”으로 대신 가입시켜 드릴 수 있습니다.</div>'; return; }
  if(!rows.length){ $('list').innerHTML='<div class="empty">해당하는 건물주가 없습니다.</div>'; return; }
  $('list').innerHTML=rows.map(function(o){
    var st;
    if(o.disabled) st='<span style="color:var(--ink3)">사용 정지</span>';
    else if(!o.setupDone) st='<span style="color:var(--warn)">'+(o.kind==='rooms'?'호실 등록 중':'건물 등록 중')+'</span>';
    else if(o.kind==='rooms') st=o.dueN ? '<span style="color:'+(o.gotN===o.dueN?'var(--brand-dark)':'var(--warn)')+'">'+(parseInt(ym.slice(5),10))+'월 '+o.gotN+'/'+o.dueN+' 입금</span> · '+won(o.billed)+'원' : '이번 달 받을 월세 없음';
    else st=(o.sent && o.ym===ym) ? '<span style="color:var(--brand-dark)">'+(parseInt(ym.slice(5),10))+'월 발송 완료</span> · '+won(o.billed)+'원' : '<span style="color:var(--warn)">'+(parseInt(ym.slice(5),10))+'월 아직 안 보냄</span>';
    var w=warnList(o).map(function(x){ return '<span class="dot '+x[1]+'">'+x[0]+'</span>'; }).join('');
    return '<div class="rw'+(o.disabled?' off':'')+'" onclick="detail(\''+o.id+'\')">'+
      '<div><div class="n">'+esc(o.name||'이름 없음')+'<small>'+esc(tel(o.phone))+'</small></div><div class="b">'+esc(o.bldg||'')+(o.units?' · '+o.units+(o.kind==='rooms'?'호실':'세대'):'')+'</div></div>'+
      '<div class="st">'+st+'<br><span style="font-weight:600;color:var(--ink3)">최근 '+day(o.updatedAt)+(o.appBuild?' · 앱 '+esc(o.appBuild):'')+'</span></div>'+
      '<div class="ic">'+(w||'<span class="dot g">정상</span>')+'</div></div>';
  }).join('');
};
function find(id){ for(var i=0;i<LIST.length;i++) if(LIST[i].id===id) return LIST[i]; return null; }
/* ---------- 서버 상태판 ---------- */
var SITE_BUILD='', NOTIFY=EASY.replace(/\/easy$/,'/notify');
function ago(s){ if(!s) return '-'; var d=new Date(s); if(isNaN(d)) return '-'; var m=Math.round((Date.now()-d)/60000); if(m<1) return '방금'; if(m<60) return m+'분 전'; var h=Math.round(m/60); if(h<48) return h+'시간 전'; return Math.round(h/24)+'일 전'; }
function when(s){ if(!s) return '-'; var d=new Date(s); if(isNaN(d)) return '-'; return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function chip(ok, label, warn){ return '<span class="chip '+(ok?'g':(warn?'y':'r'))+'">'+(ok?'✓ ':(warn?'… ':'✕ '))+label+'</span>'; }
function siteBuild(){ return fetch('easy.html?x='+Date.now(),{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){ var m=t.match(/var APP_BUILD='([^']+)'/); SITE_BUILD=m?m[1]:''; }).catch(function(){}); }
var JOBNAME={'modoo-daily-notify':'아침 9:00 할 일 문자','modoo-daily-tax':'아침 9:10 세금계산서 자동 발행'};
window.loadStatus=function(){
  var b=$('statB'); b.innerHTML='불러오는 중…';
  Promise.all([post(EASY,{action:'adminStatus',tk:TK}), post(NOTIFY,{action:'solapiCheck',tk:TK}).catch(function(){ return {ok:false}; }), siteBuild()]).then(function(R){
    var j=R[0], so=R[1];
    if(!j.ok){ b.innerHTML='<span style="color:var(--danger)">'+esc(j.error||'불러오지 못했습니다')+'</span>'; return; }
    var K=j.keys||{}, h='';
    h+='<div class="chips">'+(j.testMode?'<span class="chip y">테스트 모드 (관리자 비밀번호 없이 들어옴)</span>':'<span class="chip g">운영 모드</span>')+
      chip(K.ai,'AI 사진 읽기 키')+chip(K.nts,'국세청 키')+chip(K.solapi,'솔라피 키')+chip(K.popbill,'팝빌 키'+(K.popbill&&K.popbillTest?' (테스트 서버)':''), !K.popbill)+
      (SITE_BUILD?'<span class="chip">사이트 판 '+esc(SITE_BUILD)+'</span>':'')+'</div>';
    if(so && so.ok){ h+='<div class="kv" style="margin-top:8px"><span>솔라피 잔액</span><b>'+won(so.balance||0)+'원 · '+won(so.point||0)+'P'+(((so.balance||0)+(so.point||0))<1000?' <span style="color:var(--danger)">충전 필요</span>':'')+'</b></div>'; }
    (Array.isArray(j.cron)?j.cron:[]).forEach(function(c){
      var ok=c.last_status==='succeeded';
      h+='<div class="kv"><span>'+esc(JOBNAME[c.jobname]||c.jobname)+'</span><b style="color:'+(c.last_start?(ok?'var(--brand-dark)':'var(--danger)'):'var(--ink3)')+'">'+(c.last_start?(ok?'✓ ':'✕ ')+when(c.last_start)+' ('+ago(c.last_start)+')':'아직 안 돎')+(c.fails_7d?' · 7일 실패 '+c.fails_7d:'')+'</b></div>';
    });
    var N=(j.net||[])[0]; if(N) h+='<div class="kv"><span>마지막 예약 작업 응답</span><b style="font-weight:600;font-size:12.5px">'+esc(N.status_code)+' · '+esc(String(N.body||N.error_msg||'').slice(0,90))+'</b></div>';
    h+='<div class="kv"><span>오늘 보낸 할 일 문자</span><b>'+j.notifyToday+'통</b></div>';
    h+='<div class="kv"><span>세입자 동의</span><b>대기 '+j.consents.sent+' · 동의 '+j.consents.agreed+' · 거절 '+j.consents.declined+'</b></div>';
    h+='<div class="kv"><span>이번 달 세금계산서</span><b>발행 '+j.tax.issued+(j.tax.failed?' · <span style="color:var(--danger)">실패 '+j.tax.failed+'</span>':'')+' · 팝빌 연결 사업장 '+j.tax.members+'</b></div>';
    h+='<div class="kv"><span>앱 오류 (24시간)</span><b style="color:'+(j.errors24?'var(--danger)':'var(--brand-dark)')+'">'+j.errors24+'건</b></div>';
    if(j.errorsRecent&&j.errorsRecent.length) h+=j.errorsRecent.slice(0,3).map(function(e){ var o=find(e.owner_id); return '<div class="li">'+when(e.at)+' · <b>'+esc(o?(o.name||o.bldg):e.owner_id)+'</b> · '+esc(e.build||'')+'<br>'+esc(e.msg)+'</div>'; }).join('');
    b.innerHTML=h;
    var bad=[]; if(!K.ai) bad.push('AI 키'); if(!K.nts) bad.push('국세청 키'); if(!K.solapi) bad.push('솔라피 키');
    (Array.isArray(j.cron)?j.cron:[]).forEach(function(c){ if(c.last_start && c.last_status!=='succeeded') bad.push((JOBNAME[c.jobname]||c.jobname)+' 실패'); });
    if(so && so.ok && ((so.balance||0)+(so.point||0))<1000) bad.push('솔라피 충전');
    if(j.errors24) bad.push('앱 오류 '+j.errors24);
    $('statSum').innerHTML = bad.length ? '<span style="color:var(--danger)">⚠ '+esc(bad.join(' · '))+'</span>' : '<span style="color:var(--brand-dark)">✓ 모두 정상'+(j.testMode?' · 테스트 모드':'')+'</span>';
    render();
  }).catch(function(){ b.innerHTML='<span style="color:var(--danger)">인터넷 연결을 확인해 주세요.</span>'; $('statSum').textContent='확인 실패'; });
};
/* ---------- 건물주 상세 ---------- */
var CAT_NM={house:'주택',shop:'상가·사무실',dorm:'기숙사·사택',etc:'기타'};
function fd(x){ if(!x) return '-'; var p=String(x).split('-'); return p.length===3?p[0].slice(2)+'.'+parseInt(p[1],10)+'.'+parseInt(p[2],10):x; }
window.detail=function(id){
  var o=find(id); if(!o) return;
  sheet('<h2>'+esc(o.bldg||o.name||tel(o.phone))+'</h2><div class="sub">불러오는 중…</div>'); $('sheet').classList.add('wide');
  post(EASY,{action:'adminOwner',tk:TK,id:id}).then(function(j){
    if(!j.ok){ sheet('<h2>상세</h2><div class="msg">'+esc(j.error||'불러오지 못했습니다')+'</div><button class="btn gray" onclick="closeSheet()">닫기</button>'); return; }
    var O=j.owner, h='<h2>'+esc(O.name||'이름 없음')+' <span class="sub" style="font-weight:700">'+esc(tel(O.phone))+'</span></h2>';
    h+='<div class="chips">'+(O.disabled?'<span class="chip r">사용 정지</span>':'')+(O.setupDone?'<span class="chip g">설정 완료</span>':'<span class="chip y">설정 중</span>')+
      '<span class="chip '+(O.appBuild&&SITE_BUILD&&O.appBuild!==SITE_BUILD?'y':'')+'">앱 '+esc(O.appBuild||'기록 없음')+(O.appSeen?' · '+ago(O.appSeen):'')+'</span>'+
      (O.hasBank?'<span class="chip g">입금 통장 있음</span>':'<span class="chip r">입금 통장 없음</span>')+(O.email?'<span class="chip">'+esc(O.email)+'</span>':'')+
      (O.remind&&O.remind.alert===false?'<span class="chip y">아침 문자 끔</span>':'<span class="chip g">아침 문자 켬</span>')+'</div>';
    h+='<div class="kv" style="margin-top:8px"><span>가입 · 최근 저장 · 최근 로그인</span><b>'+when(O.createdAt)+' · '+when(O.updatedAt)+' · '+when(O.lastLogin)+'</b></div>';
    /* 호실 */
    h+='<div class="sec"><h4>🔑 호실 '+j.rooms.length+'곳</h4>'+(j.rooms.length?j.rooms.map(function(r){
      var tags=[];
      tags.push(r.cat?'<span class="chip">'+CAT_NM[r.cat]+'</span>':'<span class="chip y">구분 미정</span>');
      if(r.vacant) tags.push('<span class="chip">빈 방</span>');
      if(r.use==='biz') tags.push(r.biz?'<span class="chip g">등록증 '+esc(r.bizName)+(r.nts&&r.nts!=='open'?' ('+esc(r.nts)+')':'')+'</span>':'<span class="chip y">등록증 없음</span>');
      if(r.use==='biz') tags.push(r.tbiz?'<span class="chip g">세입자 사업자 '+esc(r.tbizName)+'</span>':'<span class="chip">세입자 사업자 없음</span>');
      if(r.taxAuto) tags.push('<span class="chip g">세금계산서 자동</span>');
      tags.push('<span class="chip">첨부 '+r.docs+'</span>');
      if(r.hist) tags.push('<span class="chip">지난 계약 '+r.hist+'</span>');
      if(r.msgsCustom) tags.push('<span class="chip">문구 수정 '+r.msgsCustom+'</span>');
      var M=r.month;
      return '<div class="room"><div class="t">'+esc(r.label)+' <span class="sub" style="font-weight:700">'+esc(r.tname||'')+(r.ttel?' · '+esc(r.ttel):'')+'</span></div>'+
        '<div class="sub">월 '+won(r.rent)+'원'+(r.vat==='sep'?' +VAT':'')+' · 매달 '+(r.day||'-')+'일 · 보증금 '+won(r.deposit)+'원 · 계약 '+fd(r.start)+' ~ '+fd(r.end)+
        (r.raise?'<br>인상 '+won(r.raise.from)+' → '+won(r.raise.to)+' ('+r.raise.pct+'%, '+(r.raise.how==='link'?'링크 동의':'서명')+')':'')+
        (M?'<br>이번 달 '+won(M.amt)+'원 · '+(M.paid?'<b style="color:var(--brand-dark)">받음 '+esc(M.at||'')+'</b>':'<b style="color:var(--warn)">아직</b>')+(M.sends?' · 문자 '+M.sends+'번':''):'')+'</div>'+
        '<div class="chips">'+tags.join('')+'</div></div>';
    }).join(''):'<div class="li">호실이 없습니다.</div>')+'</div>';
    var rl=function(rid){ for(var i=0;i<j.rooms.length;i++) if(j.rooms[i].id===rid) return j.rooms[i].label; return rid; };
    /* 동의 */
    h+='<div class="sec"><h4>📨 세입자 동의 기록</h4>'+(j.consents.length?j.consents.map(function(c){
      return '<div class="li">'+when(c.at)+' · <b>'+esc(rl(c.room))+'</b> · '+won(c.rentFrom)+' → '+won(c.rentTo)+'원 ('+c.pct+'%) · '+
        (c.status==='agreed'?'<b style="color:var(--brand-dark)">동의 '+esc(c.name)+' '+when(c.answeredAt)+'</b>':c.status==='declined'?'<b style="color:var(--danger)">거절 '+esc(c.name)+'</b>':'<b style="color:var(--warn)">대기</b>')+'</div>';
    }).join(''):'<div class="li">없음</div>')+'</div>';
    /* 알림 문자 */
    h+='<div class="sec"><h4>📲 아침 할 일 문자 (포컴 → 건물주)</h4>'+(j.notes.length?j.notes.map(function(n){
      return '<div class="li">'+when(n.at)+' · '+esc(n.to||'')+' · '+(n.ok?'<b style="color:var(--brand-dark)">보냄</b>':'<b style="color:var(--danger)">실패/미발송</b>')+'<br>'+esc(n.text)+'</div>';
    }).join(''):'<div class="li">없음</div>')+'</div>';
    /* 세금계산서 */
    h+='<div class="sec"><h4>🧾 세금계산서</h4>'+(j.popbill.length?j.popbill.map(function(m){ return '<div class="li">팝빌 연결 <b>'+esc(m.corp_num)+'</b> · '+esc(m.user_id)+(m.is_test?' (테스트)':'')+' · '+when(m.joined_at)+'</div>'; }).join(''):'<div class="li">팝빌 연결 없음</div>')+
      j.tax.map(function(t){ return '<div class="li">'+esc(t.ym)+' · <b>'+esc(rl(t.room))+'</b> · '+won(t.supply)+'+'+won(t.tax)+'원 · '+(t.status==='issued'?'<b style="color:var(--brand-dark)">발행 '+esc(t.nts||'')+'</b>':'<b style="color:var(--danger)">실패</b> '+esc(t.error))+'</div>'; }).join('')+'</div>';
    /* 오류 */
    h+='<div class="sec"><h4>⚠ 앱 오류 기록</h4>'+(j.errors.length?j.errors.map(function(e){ return '<div class="li">'+when(e.at)+' · '+esc(e.build||'')+(e.screen?' · 화면 '+esc(e.screen):'')+'<br><b>'+esc(e.msg)+'</b>'+(e.src?' <span style="color:var(--ink3)">'+esc(e.src)+'</span>':'')+'</div>'; }).join(''):'<div class="li">없음</div>')+'</div>';
    /* 메모 · 단추 */
    if(O.memo) h+='<div class="sec"><h4>📝 메모</h4><div class="memo">'+esc(O.memo)+'</div></div>';
    h+='<div class="acts" style="margin-top:16px"><button class="btn sm" onclick="closeSheet();enter(\''+id+'\')">들어가 보기</button><a class="btn sm line" href="tel:'+esc(O.phone)+'">📞 전화</a><button class="btn sm gray" onclick="openMemo(\''+id+'\')">메모</button><button class="btn sm gray" onclick="openPin(\''+id+'\')">비밀번호 다시 정하기</button><button class="btn sm gray" onclick="toggleOff(\''+id+'\')">'+(O.disabled?'정지 풀기':'사용 정지')+'</button><button class="btn sm gray" onclick="closeSheet()">닫기</button></div>';
    $('sheet').innerHTML=h; $('sheet').scrollTop=0;
  }).catch(function(){ toast('인터넷 연결을 확인해 주세요'); });
};

/* 건물주 화면으로 들어가기 (이 탭에서만 기억) */
window.enter=function(id){
  try{ sessionStorage.setItem('fc_view', JSON.stringify({tk:TK, owner:id})); }
  catch(e){ toast('이 브라우저에서는 들어갈 수 없습니다'); return; }
  location.href='easy.html';
};
window.openMemo=function(id){
  var o=find(id); if(!o) return;
  sheet('<h2>메모</h2><div class="sub">'+esc(o.bldg||o.name||tel(o.phone))+' · 운영자만 봅니다</div>'+
    '<textarea class="inp" id="mmT" rows="5" style="margin-top:12px;resize:vertical">'+esc(o.memo)+'</textarea>'+
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="saveMemo(\''+id+'\')">저장</button><button class="btn gray" onclick="closeSheet()">닫기</button></div>');
};
window.saveMemo=function(id){
  post(EASY,{action:'ownerMemo',tk:TK,id:id,memo:$('mmT').value}).then(function(j){
    if(j.ok){ closeSheet(); toast('저장했습니다'); load(); } else toast(j.error||'저장하지 못했습니다');
  }).catch(function(){ toast('인터넷 연결을 확인해 주세요'); });
};
window.openPin=function(id){
  var o=find(id); if(!o) return;
  sheet('<h2>비밀번호 다시 정하기</h2><div class="sub">'+esc(o.name||'')+' · '+esc(tel(o.phone))+'<br>건물주가 비밀번호를 잊었을 때 씁니다. 새 비밀번호를 정해 전화로 알려 주세요.</div>'+
    '<div id="pnErr" class="msg hide" style="margin-top:12px"></div>'+
    '<div class="lab">새 비밀번호 (숫자 4~6자리)</div><input class="inp" id="pnV" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">'+
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="savePin(\''+id+'\')">바꾸기</button><button class="btn gray" onclick="closeSheet()">닫기</button></div>');
};
window.savePin=function(id){
  var v=$('pnV').value.trim();
  if(!/^[0-9]{4,6}$/.test(v)){ $('pnErr').textContent='숫자 4~6자리로 넣어 주세요'; $('pnErr').classList.remove('hide'); return; }
  post(EASY,{action:'ownerSetPin',tk:TK,id:id,pin:v}).then(function(j){
    if(j.ok){ closeSheet(); toast('비밀번호를 바꿨습니다'); } else { $('pnErr').textContent=j.error||'바꾸지 못했습니다'; $('pnErr').classList.remove('hide'); }
  }).catch(function(){ toast('인터넷 연결을 확인해 주세요'); });
};
window.toggleOff=function(id){
  var o=find(id); if(!o) return;
  var on=!o.disabled;
  sheet('<h2>'+(on?'사용을 멈출까요?':'정지를 풀까요?')+'</h2><div class="sub">'+esc(o.bldg||o.name||tel(o.phone))+
    (on?'<br>건물주가 들어올 수 없게 됩니다. 자료는 지워지지 않습니다.':'<br>건물주가 다시 들어올 수 있습니다.')+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1" onclick="doOff(\''+id+'\','+(on?'true':'false')+')">'+(on?'멈추기':'풀기')+'</button><button class="btn gray" onclick="closeSheet()">아니요</button></div>');
};
window.doOff=function(id,on){
  post(EASY,{action:'ownerDisable',tk:TK,id:id,on:on}).then(function(j){
    if(j.ok){ closeSheet(); toast(on?'사용을 멈췄습니다':'정지를 풀었습니다'); load(); } else toast(j.error||'바꾸지 못했습니다');
  }).catch(function(){ toast('인터넷 연결을 확인해 주세요'); });
};
/* 전화로 가입을 도와줄 때 : 운영자가 대신 계정을 만듭니다 */
window.openNew=function(){
  sheet('<h2>건물주 등록</h2><div class="sub">전화로 도와드릴 때 대신 가입시켜 드립니다.<br>정한 비밀번호는 건물주께 알려 주세요.</div>'+
    '<div id="nwErr" class="msg hide" style="margin-top:12px"></div>'+
    '<div class="lab">성함</div><input class="inp" id="nwN" autocomplete="off">'+
    '<div class="lab">휴대폰 번호</div><input class="inp" id="nwP" type="tel" inputmode="numeric" autocomplete="off" placeholder="010-0000-0000">'+
    '<div class="lab">비밀번호 (숫자 4~6자리)</div><input class="inp" id="nwV" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">'+
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" id="nwGo" onclick="saveNew()">등록</button><button class="btn gray" onclick="closeSheet()">닫기</button></div>');
};
window.saveNew=function(){
  var e=function(m){ $('nwErr').textContent=m; $('nwErr').classList.remove('hide'); };
  var n=$('nwN').value.trim(), p=$('nwP').value.replace(/[^0-9]/g,''), v=$('nwV').value.trim();
  if(!n) return e('성함을 넣어 주세요');
  if(p.length<10) return e('휴대폰 번호를 넣어 주세요');
  if(!/^[0-9]{4,6}$/.test(v)) return e('비밀번호는 숫자 4~6자리로 넣어 주세요');
  $('nwGo').disabled=true;
  post(EASY,{action:'ownerJoin',phone:p,pin:v,name:n}).then(function(j){
    $('nwGo').disabled=false;
    if(j.ok){ closeSheet(); toast('등록했습니다'); load(); } else e(j.error||'등록하지 못했습니다');
  }).catch(function(){ $('nwGo').disabled=false; e('인터넷 연결을 확인해 주세요.'); });
};

load();
})();
</script>
</body>
</html>
